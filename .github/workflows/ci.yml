# BICII Admin CI (docs/TESTING.md "CI").
#
#   check  npm ci, typecheck + eslint + prettier, colour contrast, and a
#          type-drift check: regenerate src/lib/database.types.ts from a
#          throwaway database built from supabase/migrations and fail on diff.
#   test   unit + db Vitest projects against a Postgres 16 service container,
#          with the real Supabase Auth/PostgREST/Storage from the devstack
#          (so the live-stack smoke test runs too).
#   build  next build with placeholder public env.
#   e2e    Playwright (phone + iPad) against next start + the devstack. Runs on
#          workflow_dispatch, nightly, and on pull requests labelled "e2e".
#
# No Docker beyond the Postgres service container, and no secrets: the
# devstack uses the well-known Supabase local demo JWT secret and keys.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 18:23 UTC = 02:23 in Singapore (the shop's timezone).
    - cron: "23 18 * * *"

# Adding a label starts a separate group so it never cancels the PR's run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Every devstack script, the DB test harness and Playwright read the libpq
  # variables (DATABASE_URL would win; it is deliberately unset). The user
  # must be a superuser: the scripts create databases and the platform roles.
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: check
    # Labelling a PR re-triggers the workflow; only e2e cares about that.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          devstack: "true"
      - name: Typecheck, lint, format
        run: npm run check
      - name: Colour contrast (WCAG AA)
        run: npm run tokens:contrast
      - name: Generated database types match the migrations
        run: |
          npm run db:types -- --fresh
          if ! git diff --exit-code -- src/lib/database.types.ts; then
            echo "::error file=src/lib/database.types.ts::Out of date. Run 'npm run db:types' after changing supabase/migrations and commit the result."
            exit 1
          fi

  test:
    name: test (unit + db)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          devstack: "true"
      # The db project builds its own template database; the dev database
      # and running services are only for the live-stack smoke test.
      - name: Build bicii_dev and start the devstack
        run: |
          npm run db:reset
          npm run devstack:start
      - name: Unit and database tests
        run: npm test
        env:
          # The smoke test fails instead of skipping if the stack is down.
          BICII_REQUIRE_STACK: "1"
      - name: Devstack logs
        if: failure()
        run: tail -n 200 .devstack/logs/*.log || true

  build:
    name: build
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - name: next build
        run: npm run build
        env:
          # Placeholders: env is parsed lazily, so the build never contacts them.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_PUBLIC_SITE_URL: https://bicii.example

  e2e:
    name: e2e (Playwright)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          devstack: "true"
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build bicii_dev and start the devstack
        run: |
          npm run db:reset
          npm run devstack:start
      # playwright.config.mts builds the app and runs next start on :3100;
      # global setup resets bicii_dev again and checks a seeded login works.
      - name: Playwright
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            .devstack/logs/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
