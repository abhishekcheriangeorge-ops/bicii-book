name: Prepare
description: >-
  Node 22 (from .nvmrc) with the npm cache, `npm ci`, and optionally the
  Docker-free Supabase devstack (Auth, PostgREST, Storage) restored from
  actions/cache or built by `npm run devstack:setup`.

inputs:
  devstack:
    description: Also restore or build the devstack components ("true" or "false").
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Devstack cache key
      id: devstack-key
      if: inputs.devstack == 'true'
      shell: bash
      run: echo "key=$(node scripts/devstack/cache-key.mjs)" >> "$GITHUB_OUTPUT"

    - name: Restore devstack components
      if: inputs.devstack == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/bicii-devstack
        key: ${{ steps.devstack-key.outputs.key }}-${{ hashFiles('scripts/devstack/setup.mjs') }}

    # Idempotent: on a cache hit every component reports "cached" in seconds;
    # on a miss it downloads Auth and PostgREST and builds Storage (minutes).
    - name: Set up devstack components
      if: inputs.devstack == 'true'
      shell: bash
      run: npm run devstack:setup
